services:
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: urbaneye-api-gateway
    restart: unless-stopped
    environment:
      PORT: ${GATEWAY_PORT}

      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_CLIENT_ID: api-gateway
      KAFKA_GROUP_ID: api-gateway-consumer

      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS}

      FRONTEND_URL: ${FRONTEND_URL}
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    depends_on:
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - okogid-network

  geo-service:
    build:
      context: ./geo-service
      dockerfile: Dockerfile
    container_name: urbaneye-geo-service
    restart: unless-stopped
    environment:
      PORT: ${GEO_SERVICE_PORT}
      GEOIP_DB_PATH: /app/GeoLite2-City.mmdb
      KAFKA_BROKERS: ${KAFKA_BROKERS} 
      KAFKA_GROUP_ID: ${GEO_KAFKA_GROUP_ID}
      KAFKA_REQUEST_TOPIC: ${GEO_KAFKA_REQUEST_TOPIC}
      ALLOWED_ORIGINS: ${FRONTEND_URL}  
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - okogid-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: okogid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - okogid-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.3.0
    container_name: okogid-kafka
    hostname: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9094:9094"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    networks:
      - okogid-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: okogid-notification-service
    restart: unless-stopped
    environment:
      PORT: ${NOTIFICATION_PORT}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}

      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL}

      FRONTEND_URL: ${FRONTEND_URL}
    ports:
      - "${NOTIFICATION_PORT}:${NOTIFICATION_PORT}"
    networks:
      - okogid-network

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: okogid-auth-service
    restart: unless-stopped
    environment:
      DATABASE_URL: ${AUTH_DATABASE_URL}

      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID}

      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS}

      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES}

      ARGON2_MEMORY_COST: ${ARGON2_MEMORY_COST}
      ARGON2_TIME_COST: ${ARGON2_TIME_COST}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM}

      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      notification-service:
        condition: service_started
    networks:
      - okogid-network

  camera-mediamtx:
    image: bluenviron/mediamtx:1
    container_name: camera-mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"
      - "8889:8889"
      - "8189:8189/udp"
    expose:
      - "9997"
      - "9998"
    volumes:
      - ./stream-service/mediamtx.yml:/mediamtx.yml:ro
    networks:
      - okogid-network

  camera-stream-api:
    build:
      context: ./stream-service
      dockerfile: Dockerfile
    container_name: camera-stream-api
    restart: unless-stopped
    environment:
      PORT: 3000

      CAMERAS_CONFIG_PATH: /app/config/cameras.local.json

      MEDIAMTX_API_URL: http://camera-mediamtx:9997
      MEDIAMTX_API_USER: stream_service
      MEDIAMTX_API_PASSWORD: stream_service_password

      MEDIAMTX_WEBRTC_PUBLIC_URL: http://localhost:8889

      KAFKA_ENABLED: "true"
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: camera-stream-service
      KAFKA_GROUP_ID: camera-stream-service-consumer
    volumes:
      - ./stream-service/config:/app/config:ro
    depends_on:
      kafka:
        condition: service_healthy
      camera-mediamtx:
        condition: service_started
    networks:
      - okogid-network

  camera-postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: urbaneye-camera-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CAMERA_POSTGRES_DB}
      POSTGRES_USER: ${CAMERA_POSTGRES_USER}
      POSTGRES_PASSWORD: ${CAMERA_POSTGRES_PASSWORD}
    ports:
      - "${CAMERA_POSTGRES_PORT}:5432"
    volumes:
      - camera_postgres_data:/var/lib/postgresql/data
    networks:
      - okogid-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${CAMERA_POSTGRES_USER} -d ${CAMERA_POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  camera-service:
    build:
      context: ./camera-service
      dockerfile: Dockerfile
    container_name: urbaneye-camera-service
    restart: unless-stopped
    environment:
      DATABASE_URL: ${CAMERA_DATABASE_URL}
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: ${CAMERA_SERVICE_KAFKA_CLIENT_ID}
      KAFKA_GROUP_ID: ${CAMERA_SERVICE_KAFKA_GROUP_ID}
      CAMERA_CONNECTION_ENCRYPTION_KEY: ${CAMERA_CONNECTION_ENCRYPTION_KEY}
    depends_on:
      camera-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - okogid-network

volumes:
  postgres_data:
  camera_postgres_data:
  kafka_data:

networks:
  okogid-network:
    driver: bridge