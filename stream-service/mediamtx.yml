logLevel: info

authMethod: internal

authInternalUsers:
  # Анонимный пользователь для чтения публичных WebRTC-потоков.
  - user: any
    pass:
    ips: []
    permissions:
      - action: read
        path:
      - action: playback
        path:

  # Пользователь для NestJS Stream Service и FFmpeg-публикации.
  - user: stream_service
    pass: stream_service_password
    ips: []
    permissions:
      - action: api
      - action: metrics
      - action: pprof
      - action: publish
        path:

api: yes
apiAddress: :9997

metrics: yes
metricsAddress: :9998

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]

webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189

webrtcAdditionalHosts: [localhost]

pathDefaults:
  rtspTransport: tcp

paths:
  all_others: