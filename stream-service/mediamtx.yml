logLevel: info

authMethod: internal

authInternalUsers:
  # Анонимный пользователь для чтения публичных WebRTC-потоков.
  - user: any
    pass:
    ips: []
    permissions:
      - action: read
        path:
      - action: playback
        path:

  # Пользователь для NestJS Stream Service.
  - user: stream_service
    pass: stream_service_password
    ips: []
    permissions:
      - action: api
      - action: metrics
      - action: pprof

api: yes
apiAddress: :9997

metrics: yes
metricsAddress: :9998

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]

webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189

# Для локальной разработки.
# На сервере сюда нужно будет добавить внешний домен/IP.
webrtcAdditionalHosts: [localhost]

pathDefaults:
  sourceOnDemand: yes
  rtspTransport: tcp

paths: {}