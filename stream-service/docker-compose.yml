services:
  mediamtx:
    image: bluenviron/mediamtx:1
    container_name: camera-mediamtx
    ports:
      - "8554:8554"
      - "8889:8889"
      - "8189:8189/udp"
      - "9997:9997"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

  stream-api:
    build: .
    container_name: camera-stream-api
    ports:
      - "3001:3000"
    environment:
      PORT: 3000
      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_API_USER: stream_service
      MEDIAMTX_API_PASSWORD: stream_service_password
      MEDIAMTX_WEBRTC_PUBLIC_URL: http://localhost:8889
      CAMERAS_CONFIG_PATH: /app/config/cameras.local.json
    volumes:
      - ./config:/app/config:ro
    depends_on:
      - mediamtx